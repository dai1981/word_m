name: Deploy koten to Lolipop

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 古典HTMLを生成（koten_data/*.json -> exam/koten/*.html）
        run: python3 generate_koten.py

      - name: ロリポップへ FTP アップロード（古典 /exam/koten/）
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ftp.lolipop.jp
          username: lolipop.jp-dp07302908
          password: 2021eigoduke
          protocol: ftps
          local-dir: ./exam/koten/
          server-dir: /exam/koten/
          state-name: .ftp-deploy-koten.json  # 古典専用の状態ファイル
