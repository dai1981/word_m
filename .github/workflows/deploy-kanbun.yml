name: Deploy kanbun to Lolipop

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 漢文HTMLを生成（kanbun_data/*.json -> exam/kanbun/*.html）
        run: python3 generate_kanbun.py

      - name: ロリポップへ FTP アップロード（漢文 /exam/kanbun/）
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ftp.lolipop.jp
          username: lolipop.jp-dp07302908
          password: 2021eigoduke
          protocol: ftps
          local-dir: ./exam/kanbun/
          server-dir: /exam/kanbun/
          state-name: .ftp-deploy-kanbun.json  # 漢文専用の状態ファイル
